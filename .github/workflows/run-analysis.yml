name: Reproduce Paper 3 archive audit
on:
  workflow_dispatch:
  push:
    paths: ['code/**', 'tests/**', 'data/**', 'manuscript/**', 'references/**', 'requirements.txt', '.github/workflows/run-analysis.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python code/replicate.py
      - name: Verify mirror
        run: python code/sync_overleaf.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: paper3-compact-replication
          path: |
            results/corpus_audit.json
            results/*transition*.csv
            results/manuscript_audit.json
            results/validation_status.json
            deliverables/paper3-overleaf.zip
